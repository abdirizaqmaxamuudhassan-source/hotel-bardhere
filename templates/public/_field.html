<div class="mb-3">
  <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="text-secondary fw-normal small">(optional)</span>{% endif %}</label>
  {{ field }}
  {% for e in field.errors %}<div class="text-danger small mt-1">{{ e }}</div>{% endfor %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
</div>
