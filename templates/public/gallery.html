{% extends "public/base.html" %}
{% load hb_tags %}
{% block title %}{% t "Gallery" %} – {{ site.hotel_name }}{% endblock %}
{% block content %}
<header class="page-head"><div class="container"><h1>{% t "Gallery" %}</h1></div></header>
<section class="section">
  <div class="container">
    {% if images %}<div class="gallery-grid">{% for g in images %}<a href="{{ g.image.url }}" target="_blank" rel="noopener"><img src="{{ g.image.url }}" alt="{% loc g 'title' %}" loading="lazy"></a>{% endfor %}</div>
    {% else %}<div class="empty-note">{% t "Photos coming soon." %}</div>{% endif %}
  </div>
</section>
{% endblock %}
