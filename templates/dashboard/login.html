{% load static %}<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
  <title>Staff login | {{ site.hotel_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-wrap"><div class="login-card">
  <h1 class="display mb-0" style="font-size:2rem">{{ site.hotel_name }}</h1>
  <p class="text-secondary mb-4">Staff login</p>
  {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
    <div class="mb-3"><label class="form-label fw-semibold" for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}</div>
    <div class="mb-3"><label class="form-label fw-semibold" for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-gold w-100" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0 small"><a href="{% url 'core:home' %}">Back to website</a></p>
</div></div>
</body></html>
